name: Update Python dependencies

on:
  # Run every Sunday at 04:00 PT so an updated requirements.txt is ready
  # before the work week starts.
  schedule:
    - cron: "0 12 * * 0"   # 12:00 UTC = 05:00 PT (Sun)

  # Allow manual trigger from the GitHub Actions UI at any time.
  workflow_dispatch:
    inputs:
      packages:
        description: >
          Space-separated list of packages to upgrade.
          Leave blank to upgrade all packages in requirements.txt.
        required: false
        default: ""

jobs:
  update-deps:
    name: Upgrade pip packages and open PR
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-tools
        run: pip install --quiet pip-tools pip

      - name: Upgrade packages
        id: upgrade
        run: |
          set -euo pipefail

          PKGS="${{ github.event.inputs.packages }}"

          if [[ -z "$PKGS" ]]; then
            echo "Upgrading ALL packages in requirements.txt..."
            pip install --quiet --upgrade $(grep -v '^#' requirements.txt | grep -v '^$' | sed 's/[>=<].*//')
          else
            echo "Upgrading: $PKGS"
            pip install --quiet --upgrade $PKGS
          fi

          # Re-freeze to get exact installed versions.
          # We keep the ">=" lower-bound format so the file stays readable.
          echo "Freezing updated versions..."
          pip freeze \
            | grep -iE "^(instagrapi|pydantic|selenium|fastapi|uvicorn|faster-whisper|static-ffmpeg|ctranslate2|av|huggingface-hub)==" \
            > /tmp/new_versions.txt || true

          # Patch requirements.txt: update version numbers while preserving comments.
          cp requirements.txt requirements.txt.bak
          python3 - << 'EOF'
          import re, pathlib

          new_versions = {}
          for line in pathlib.Path('/tmp/new_versions.txt').read_text().splitlines():
              name, ver = line.split('==', 1)
              new_versions[name.lower().replace('-', '_')] = ver

          lines = pathlib.Path('requirements.txt').read_text().splitlines()
          out = []
          for line in lines:
              stripped = line.strip()
              if stripped.startswith('#') or not stripped:
                  out.append(line)
                  continue
              # Extract package name (before any >=, ==, <=, !=, ~=, [extra])
              m = re.match(r'^([A-Za-z0-9_\-]+)', stripped)
              if not m:
                  out.append(line)
                  continue
              pkg_key = m.group(1).lower().replace('-', '_')
              if pkg_key in new_versions:
                  # Update the minimum version to the newly installed version.
                  # Preserve everything after the version spec (e.g. comments).
                  comment = ''
                  if '#' in line:
                      comment = '  ' + line[line.index('#'):]
                  # Preserve < upper bound if present (e.g. pydantic <3.0.0)
                  upper = ''
                  um = re.search(r'(<[^,\s]+)', stripped)
                  if um:
                      upper = f',{um.group(1)}'
                  out.append(f"{m.group(1)}>={new_versions[pkg_key]}{upper}{comment}")
              else:
                  out.append(line)

          pathlib.Path('requirements.txt').write_text('\n'.join(out) + '\n')
          EOF

          # Also update worker/requirements.txt using same logic
          cp requirements.txt worker/requirements.txt

          echo "Updated packages:"
          diff requirements.txt.bak requirements.txt || true
          rm requirements.txt.bak

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet requirements.txt worker/requirements.txt \
            && echo "changed=false" >> "$GITHUB_OUTPUT" \
            || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): upgrade Python packages"
          branch: "deps/python-upgrade-${{ github.run_id }}"
          title: "chore(deps): upgrade Python packages"
          body: |
            Auto-generated by the **Update Python dependencies** workflow.

            ### What changed
            Updated `requirements.txt` (and `worker/requirements.txt`) to the
            latest compatible versions of all tracked packages.

            ### Packages most likely to matter
            - **instagrapi** — tracks Instagram's private API; patch bumps often
              fix login, challenge, or search regressions
            - **faster-whisper / ctranslate2** — transcription accuracy + speed
              improvements

            ### Next steps
            1. Review the version diffs below.
            2. Merge — Railway will deploy the new versions on next start.
               The startup auto-upgrade script will also pick them up immediately.

            Auto-generated ✅
          labels: |
            dependencies
            python
          delete-branch: true

      - name: No changes
        if: steps.diff.outputs.changed == 'false'
        run: echo "All packages are already up to date — no PR needed."
